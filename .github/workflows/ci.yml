name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: echo "PDF_PYTHON_BIN=python" >> "$GITHUB_ENV"
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Docker build
        run: docker build -t towteam .
