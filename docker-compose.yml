services:
  towteam:
    image: node:24-bookworm-slim
    container_name: towteam
    working_dir: /app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: /app/data/towteam.sqlite
      NODE_ENV: production
      APP_UPDATE_ENABLED: "true"
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /app
    volumes:
      - .:/app
      - towteam_node_modules:/app/node_modules
      - ./data:/app/data
    command: sh -c "apt-get update && apt-get install -y --no-install-recommends build-essential git python3 python3-pip poppler-utils && python3 -m pip install --break-system-packages -r requirements.txt && npm ci && npm run build && npm run start"

volumes:
  towteam_node_modules:
